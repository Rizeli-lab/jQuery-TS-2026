<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title></title>
    <style>
      .blue {
        color: #00d;
      }

      .red {
        color: #d00;
      }

      .green {
        color: green;
        font-weight: 800;
      }

      .evenp {
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h1>Dit is een h1</h1>
    <p class="evenp">Lorem ipsum stuff</p>
    <h1 id="tweedeh1">De tweede h1</h1>
    <p>Lorem ipsum met een lijst</p>
    <ul id="unorderedlist">
      <li>nr.1</li>
      <li>nr.2</li>
      <li>nr.3</li>
    </ul>
    <h1>Nog maar een h1 dan</h1>
    <p class="evenp">Dit is de laatste lorem ipsum</p>
    <h2 id="eersteh2">Eerste h2</h2>
    <h2>Tweede h2</h2>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      $(document).ready(function () {
        $("h1").addClass("blue");
        $("#tweedeh1").addClass("red");
        $("#unorderedlist li:last").addClass("green");
        $(".evenp").css({
          border: "1px solid black",
          color: "purple",
          "border-radius": "5px",
        });
        $("h2").css("font-style", "italic");
        $("h2:first").addClass("red");
      });
    </script>
  </body>
</html>
